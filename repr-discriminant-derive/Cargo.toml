[package]
name = "repr-discriminant-derive"
version = "2.0.0"
description = "Derive macro to generate a method to access the discriminant of an enum variant with a repr(T) at runtime"
authors = ["Richard Neumann <neumann@paulmann.de>"]
license = "MIT"
repository = "https://github.com/PaulmannLighting/repr-discriminant"
documentation = "https://docs.rs/repr-discriminant-derive"
categories = ["rust-patterns"]
keywords = ["enum", "discriminant", "repr", "attribute", "macro"]
exclude = [".gitignore"]
edition = "2024"

[dependencies]
quote = "1.0"
syn = "2.0"
proc-macro2 = "1.0"

[lib]
proc-macro = true

[lints]
workspace = true